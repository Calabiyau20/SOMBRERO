name: Build Messy Hat Tricks

permissions:
  contents: write

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (VST3 / AU / CLAP, universal)
            os: macos-latest
          - name: Windows (VST3 / CLAP)
            os: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configure (macOS, universal)
        if: runner.os == 'macOS'
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=10.13

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel 4

      - name: Collect macOS plugins
        if: runner.os == 'macOS'
        run: |
          mkdir -p out
          cp -R build/MessyHatTricks_artefacts/Release/VST3/*.vst3      out/ || true
          cp -R build/MessyHatTricks_artefacts/Release/AU/*.component   out/ || true
          cp -R build/MessyHatTricks_artefacts/Release/CLAP/*.clap      out/ || true
          cp -R build/MessyHatTricks_artefacts/Release/Standalone/*.app out/ || true

      - name: Ad-hoc sign and verify (macOS)
        if: runner.os == 'macOS'
        run: |
          for b in out/*; do codesign --force --deep --sign - "$b"; done
          for b in out/*; do
            echo "== $b"
            codesign --verify --deep --strict --verbose=2 "$b" 2>&1 | tail -2
            lipo -archs "$b"/Contents/MacOS/* 2>/dev/null || true
            vtool -show-build "$b"/Contents/MacOS/* 2>/dev/null | grep -E "platform|minos" || true
          done

      - name: Collect Windows plugins
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p out
          cp -R build/MessyHatTricks_artefacts/Release/VST3/*.vst3      out/ || true
          cp -R build/MessyHatTricks_artefacts/Release/CLAP/*.clap      out/ || true
          cp -R build/MessyHatTricks_artefacts/Release/Standalone/*.exe out/ || true

      # The AGPL asks that whoever gets a binary can get the matching source.
      # Shipping it inside the release satisfies that without a public repo.
      - name: Add the licence, the credits and the corresponding source
        shell: bash
        run: |
          cp LICENSE CREDITS.md INSTALL.md out/
          mkdir -p out/source/Source out/source/Resources
          cp Source/*.h Source/*.cpp out/source/Source/
          cp Resources/*.png          out/source/Resources/
          cp CMakeLists.txt LICENSE CREDITS.md README.md out/source/
          cp -R scripts out/source/ || true

      - name: Add the installer script (macOS)
        if: runner.os == 'macOS'
        run: |
          cp scripts/Install-macOS.command out/
          chmod +x out/Install-macOS.command

      - name: Add the installer script (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: cp scripts/Install-Windows.bat out/

      - name: Zip (macOS)
        if: runner.os == 'macOS'
        run: cd out && zip -qry ../MessyHatTricks-macOS.zip . && cd ..

      - name: Zip (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path out\* -DestinationPath MessyHatTricks-Windows.zip -Force

      - uses: actions/upload-artifact@v4
        with:
          name: MessyHatTricks-${{ runner.os }}
          path: out/

      - name: Publish the zip on a dist branch
        shell: bash
        run: |
          git config user.name "Messy Hat Tricks CI"
          git config user.email "ci@calabiyau.live"
          git checkout --orphan dist-${{ runner.os }}
          git reset
          git add -f MessyHatTricks-${{ runner.os }}.zip
          git commit -q -m "Messy Hat Tricks binaries for ${{ runner.os }} (${{ github.sha }})"
          git push -f origin HEAD:dist-${{ runner.os }}
